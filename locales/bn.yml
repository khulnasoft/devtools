  sql-prettify:
    title: SQL সুন্দর করা এবং ফরম্যাট
    description: আপনার SQL কোয়েরি অনলাইনে ফরম্যাট এবং সুন্দর করুন (এটি বিভিন্ন SQL ডায়ালেক্ট সাপোর্ট করে)।

  benchmark-builder:
    title: বেঞ্চমার্ক বিল্ডার
    description: এই খুব সাধারণ অনলাইন বেঞ্চমার্ক বিল্ডার দিয়ে টাস্কের এক্সিকিউশন টাইম সহজেই তুলনা করুন।

  git-memo:
