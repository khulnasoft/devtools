  bip39-generator:
    title: BIP39 পাসফ্রেজ জেনারেটর
    description: একটি বিদ্যমান বা র্যান্ডম মনেমোনিক থেকে একটি BIP39 পাসফ্রেজ জেনারেট করুন, অথবা পাসফ্রেজ থেকে মনেমোনিক পান।

  base64-file-converter:
    title: Base64 ফাইল কনভার্টার
    description: একটি স্ট্রিং, ফাইল, বা ছবিকে তার base64 উপস্থাপনায় কনভার্ট করুন।

  list-converter:
    title: লিস্ট কনভার্টার
    description: এই টুলটি কলাম-ভিত্তিক ডেটা প্রসেস করতে পারে এবং প্রতিটি সারিতে বিভিন্ন পরিবর্তন (ট্রান্সপোজ, প্রিফিক্স এবং সাফিক্স যোগ করা, লিস্ট রিভার্স করা, লিস্ট সর্ট করা, ছোট হাতের মান, মান ট্রাঙ্কেট করা) প্রয়োগ করতে পারে।

  base64-string-converter:
    title: Base64 স্ট্রিং এনকোডার/ডিকোডার
    description: সহজেই স্ট্রিংগুলিকে তাদের base64 উপস্থাপনায় এনকোড এবং ডিকোড করুন।

