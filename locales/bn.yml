  yaml-prettify:
    title: YAML সুন্দর করা এবং ফরম্যাট
    description: আপনার YAML স্ট্রিংকে একটি বন্ধুত্বপূর্ণ, মানুষের পঠনযোগ্য ফরম্যাটে সুন্দর করুন।

  eta-calculator:
    title: ETA ক্যালপুলেটর
    description: একটি ETA (Estimated Time of Arrival) ক্যালপুলেটর যা একটি টাস্কের আনুমানিক শেষ সময় নির্ধারণ করে, উদাহরণস্বরূপ, একটি ফাইল ডাউনলোডের শেষ সময় এবং সময়কাল।

  roman-numeral-converter:
    title: রোমান সংখ্যা কনভার্টার
