about:
  content: |
    # devtools সম্পর্কে

    এই চমৎকার ওয়েবসাইটটি [KhulnaSoft](https://devtools.khulnasoft.com?utm_source=devtools&utm_medium=about) দ্বারা ❤ দিয়ে তৈরি করা হয়েছে, এটি ডেভেলপার এবং IT-এ কাজ করা মানুষদের জন্য দরকারী টুলস সংগ্রহ করে। আপনি যদি এটি দরকারী মনে করেন, তবে এটি এমন মানুষদের সাথে শেয়ার করতে দ্বিধা করবেন না যারা এটি দরকারী মনে করতে পারে এবং এটি আপনার শর্টকাট বারে বুকমার্ক করতে ভুলবেন না!

    Dev Tools ওপেন-সোর্স (GPL-3.0 লাইসেন্সের অধীনে) এবং ফ্রি, এবং সবসময় থাকবে, কিন্তু এটি হোস্ট করতে এবং ডোমেইন নাম নবায়ন করতে আমার টাকা খরচ হয়। আপনি যদি আমার কাজ সাপোর্ট করতে চান এবং আরও টুলস যোগ করতে উৎসাহিত করতে চান, তবে [sponsoring me](https://www.buymeacoffee.com/khulnasoft) এর মাধ্যমে সাপোর্ট করার কথা বিবেচনা করুন।

    ## প্রযুক্তি

    Dev Tools Vue.js (Vue 3) দিয়ে তৈরি এবং Naive UI কম্পোনেন্ট লাইব্রেরি ব্যবহার করে এবং Vercel দ্বারা হোস্ট এবং কন্টিনিউয়াসলি ডিপ্লয় করা হয়। কিছু টুলসে থার্ড-পার্টি ওপেন-সোর্স লাইব্রেরি ব্যবহার করা হয়, আপনি সম্পূর্ণ তালিকা রিপোজিটরির [package.json](https://github.com/khulnasoft/devtools/blob/main/package.json) ফাইলে পেতে পারেন।

    ## বাগ পেয়েছেন? কোনো টুল মিসিং?

    আপনার যদি এমন কোনো টুল দরকার হয় যা বর্তমানে এখানে নেই এবং আপনি মনে করেন এটি দরকারী হতে পারে, তবে আপনি GitHub রিপোজিটরির [issues section](https://github.com/khulnasoft/devtools/issues/new/choose) এ একটি ফিচার রিকোয়েস্ট জমা দিতে স্বাগত।

    এবং আপনি যদি কোনো বাগ পান, অথবা কিছু আশা মতো কাজ না করে, তবে GitHub রিপোজিটরির [issues section](https://github.com/khulnasoft/devtools/issues/new/choose) এ একটি বাগ রিপোর্ট ফাইল করুন।

