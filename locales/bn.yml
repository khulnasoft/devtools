    title: TOML থেকে YAML
    description: TOML পার্স করুন এবং YAML এ কনভার্ট করুন।

  math-evaluator:
    title: গণিত ইভালুয়েটর
    description: গাণিতিক এক্সপ্রেশন মূল্যায়ন করার জন্য একটি ক্যালকুলেটর। আপনি sqrt, cos, sin, abs ইত্যাদি ফাংশন ব্যবহার করতে পারেন।

  json-to-yaml-converter:
    title: JSON থেকে YAML কনভার্টার
    description: এই অনলাইন লাইভ কনভার্টার দিয়ে সহজেই JSON কে YAML এ কনভার্ট করুন।

  url-parser:
    title: URL পার্সার
    description: একটি URL কে তার আলাদা অংশে পার্স করুন (protocol, origin, params, port, username-password, ...)

  iban-validator-and-parser:
    title: IBAN ভ্যালিডেটর এবং পার্সার
    description: IBAN নম্বর যাচাই করুন এবং পার্স করুন। একটি IBAN বৈধ কিনা তা পরীক্ষা করুন এবং দেশ, BBAN, এটি একটি QR-IBAN কিনা এবং IBAN বন্ধুত্বপূর্ণ ফরম্যাট পান।

