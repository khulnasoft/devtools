about:
  content: >
    # IT-Tools সম্পর্কে

    এই চমৎকার ওয়েবসাইটটি, [Corentin Thomasset](https://khulnasoft.com?utm_source=it-tools&utm_medium=about) দ্বারা ❤ দিয়ে তৈরি, ডেভেলপার এবং IT-তে কাজ করা লোকদের জন্য দরকারী সরঞ্জামগুলি একত্রিত করে। আপনি যদি এটি দরকারী মনে করেন, তবে এটি এমন লোকদের সাথে শেয়ার করতে দ্বিধা করবেন না যারা এটিকে দরকারী মনে করতে পারেন এবং আপনার শর্টকাট বারে এটি বুকমার্ক করতে ভুলবেন না!

    IT Tools ওপেন-সোর্স (GPL-3.0 লাইসেন্সের অধীনে) এবং বিনামূল্যে, এবং সর্বদা থাকবে, তবে এটি হোস্ট করতে এবং ডোমেন নামটি পুনর্নবীকরণ করতে আমার অর্থ খরচ হয়। আপনি যদি আমার কাজকে সমর্থন করতে চান এবং আমাকে আরও সরঞ্জাম যোগ করতে উত্সাহিত করতে চান তবে দয়া করে [আমাকে স্পনসর করে](https://www.buymeacoffee.com/cthmsst) সমর্থন করার কথা বিবেচনা করুন।

    ## প্রযুক্তি

    IT Tools Vue.js (Vue 3) দিয়ে তৈরি Naive UI কম্পোনেন্ট লাইব্রেরি দিয়ে তৈরি এবং Vercel দ্বারা হোস্ট এবং ক্রমাগত স্থাপন করা হয়। কিছু সরঞ্জামে তৃতীয় পক্ষের ওপেন-সোর্স লাইব্রেরি ব্যবহার করা হয়, আপনি রেপোজিটরির [package.json](https://github.com/khulnasoft/devtools/blob/main/package.json) ফাইলে সম্পূর্ণ তালিকা পেতে পারেন।

    ## একটি বাগ খুঁজে পেয়েছেন? একটি সরঞ্জাম অনুপস্থিত?

    আপনি যদি এমন একটি সরঞ্জামের প্রয়োজন হয় যা বর্তমানে এখানে উপস্থিত নেই এবং আপনি মনে করেন এটি দরকারী হতে পারে, আপনি GitHub রেপোজিটরির [issues section](https://github.com/khulnasoft/devtools/issues/new/choose) এ একটি ফিচার রিকোয়েস্ট জমা দিতে স্বাগতম।

    এবং যদি আপনি একটি বাগ খুঁজে পান, বা কিছু প্রত্যাশিত হিসাবে কাজ না করে, দয়া করে GitHub রেপোজিটরির [issues section](https://github.com/khulnasoft/devtools/issues/new/choose) এ একটি বাগ রিপোর্ট জমা দিন।
