<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Tools</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    
    .header {
      background: linear-gradient(135deg, #18a058 0%, #16b875 100%);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .search-container {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #18a058;
    }
    
    .quick-actions {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .action-btn {
      padding: 8px 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    
    .tools-list {
      padding: 12px 16px;
      max-height: 350px;
      overflow-y: auto;
    }
    
    .tool-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .tool-item:hover {
      border-color: #18a058;
      box-shadow: 0 2px 8px rgba(24, 160, 88, 0.1);
    }
    
    .tool-icon {
      width: 32px;
      height: 32px;
      background: #f1f5f9;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 16px;
    }
    
    .tool-info {
      flex: 1;
    }
    
    .tool-name {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 2px;
    }
    
    .tool-category {
      font-size: 11px;
      color: #64748b;
    }
    
    .category-header {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      margin: 16px 0 8px 0;
      padding-left: 4px;
    }
    
    .footer {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .footer-link {
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
    }
    
    .footer-link:hover {
      color: #18a058;
    }
    
    .preferences-btn {
      padding: 6px 12px;
      background: #18a058;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    
    .hidden {
      display: none !important;
    }
    
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛠️ Dev Tools</h1>
  </div>
  
  <div class="search-container">
    <input type="text" class="search-input" placeholder="Search tools..." id="searchInput">
  </div>
  
  <div class="quick-actions">
    <button class="action-btn" id="inspectBtn">🔍 Inspect Element</button>
    <button class="action-btn" id="screenshotBtn">📸 Screenshot</button>
    <button class="action-btn" id="openSiteBtn">🌐 Open Dev Tools</button>
  </div>
  
  <div class="tools-list" id="toolsList">
    <!-- Tools will be populated by JavaScript -->
  </div>
  
  <div class="footer">
    <a href="https://github.com/khulnasoft/devtools" class="footer-link" target="_blank">GitHub</a>
    <button class="preferences-btn" id="preferencesBtn">⚙️ Preferences</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
