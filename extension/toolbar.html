<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Tools Toolbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: transparent;
      overflow: hidden;
    }
    
    /* Toolbar Container */
    .it-toolbar {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .it-toolbar:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
    }
    
    /* Sleeping state */
    .it-toolbar.sleeping {
      opacity: 0.6;
      transform: translateY(-50%) scale(0.9);
    }
    
    .it-toolbar.sleeping:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }
    
    /* Toolbar Button */
    .toolbar-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
      color: #1e293b;
      position: relative;
    }
    
    .toolbar-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    
    .toolbar-btn:active {
      transform: scale(0.95);
    }
    
    .toolbar-btn.active {
      background: #18a058;
      color: white;
    }
    
    /* Tooltip */
    .tooltip {
      position: absolute;
      right: 100%;
      top: 50%;
      transform: translateY(-50%) translateX(-8px);
      background: #1e293b;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
    }
    
    .toolbar-btn:hover .tooltip {
      opacity: 1;
      transform: translateY(-50%) translateX(-12px);
    }
    
    /* Menu Panel */
    .menu-panel {
      position: absolute;
      right: 100%;
      top: 0;
      width: 280px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
      padding: 8px;
      margin-right: 8px;
      opacity: 0;
      visibility: hidden;
      transform: translateX(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }
    
    /* Menu Search */
    .menu-search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.9);
      transition: border-color 0.2s;
    }
    
    .menu-search:focus {
      outline: none;
      border-color: #18a058;
    }
    
    /* Menu Section */
    .menu-section {
      margin-bottom: 8px;
    }
    
    .menu-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      padding: 8px 12px 4px;
    }
    
    /* Menu Item */
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      color: #1e293b;
    }
    
    .menu-item:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    
    .menu-item-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    .menu-item-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
    }
    
    .menu-item-shortcut {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    /* Divider */
    .menu-divider {
      height: 1px;
      background: rgba(0, 0, 0, 0.08);
      margin: 8px 0;
    }
    
    /* Status Indicator */
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #18a058;
      position: absolute;
      top: 8px;
      right: 8px;
    }
    
    .status-indicator.sleeping {
      background: #94a3b8;
    }
    
    /* Drag Handle */
    .drag-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 24px;
      cursor: move;
      z-index: 10;
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      .it-toolbar {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(255, 255, 255, 0.1);
      }
      
      .toolbar-btn {
        color: #f1f5f9;
      }
      
      .toolbar-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      
      .menu-panel {
        background: rgba(30, 41, 59, 0.98);
        border-color: rgba(255, 255, 255, 0.1);
      }
      
      .menu-search {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.1);
        color: #f1f5f9;
      }
      
      .menu-item {
        color: #f1f5f9;
      }
      
      .menu-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      
      .tooltip {
        background: #f1f5f9;
        color: #1e293b;
      }
    }
  </style>
</head>
<body>
  <div class="it-toolbar" id="toolbar">
    <div class="status-indicator" id="statusIndicator"></div>
    <div class="drag-handle" id="dragHandle"></div>
    
    <!-- Menu Button -->
    <button class="toolbar-btn" id="menuBtn" title="Open Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <span class="tooltip">Menu (Ctrl)</span>
    </button>
    
    <!-- Search Button -->
    <button class="toolbar-btn" id="searchBtn" title="Search Tools">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="tooltip">Search</span>
    </button>
    
    <!-- Inspect Button -->
    <button class="toolbar-btn" id="inspectBtn" title="Inspect Element">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 12h20"></path>
        <path d="M2 12l5-5"></path>
        <path d="M2 12l5 5"></path>
        <path d="M22 12l-5-5"></path>
        <path d="M22 12l-5 5"></path>
      </svg>
      <span class="tooltip">Inspect</span>
    </button>
    
    <!-- Screenshot Button -->
    <button class="toolbar-btn" id="screenshotBtn" title="Screenshot">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span class="tooltip">Screenshot</span>
    </button>
    
    <!-- Hide Button -->
    <button class="toolbar-btn" id="hideBtn" title="Hide Toolbar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span class="tooltip">Hide</span>
    </button>
    
    <!-- Menu Panel -->
    <div class="menu-panel" id="menuPanel">
      <input type="text" class="menu-search" id="menuSearch" placeholder="Search tools...">
      
      <div class="menu-section">
        <div class="menu-section-title">Quick Actions</div>
        <a class="menu-item" href="#" data-action="search">
          <span class="menu-item-icon">🔍</span>
          <span class="menu-item-text">Search Tools</span>
          <span class="menu-item-shortcut">/</span>
        </a>
        <a class="menu-item" href="#" data-action="inspect">
          <span class="menu-item-icon">🔬</span>
          <span class="menu-item-text">Inspect Element</span>
        </a>
        <a class="menu-item" href="#" data-action="screenshot">
          <span class="menu-item-icon">📸</span>
          <span class="menu-item-text">Screenshot</span>
        </a>
      </div>
      
      <div class="menu-divider"></div>
      
      <div class="menu-section">
        <div class="menu-section-title">Popular Tools</div>
        <a class="menu-item" href="https://devtools.khulnasoft.com/json-viewer" target="_blank">
          <span class="menu-item-icon">👁️</span>
          <span class="menu-item-text">JSON Viewer</span>
        </a>
        <a class="menu-item" href="https://devtools.khulnasoft.com/base64-string-converter" target="_blank">
          <span class="menu-item-icon">📝</span>
          <span class="menu-item-text">Base64 Converter</span>
        </a>
        <a class="menu-item" href="https://devtools.khulnasoft.com/regex-tester" target="_blank">
          <span class="menu-item-icon">🔍</span>
          <span class="menu-item-text">Regex Tester</span>
        </a>
        <a class="menu-item" href="https://devtools.khulnasoft.com/color-converter" target="_blank">
          <span class="menu-item-icon">🎨</span>
          <span class="menu-item-text">Color Converter</span>
        </a>
      </div>
      
      <div class="menu-divider"></div>
      
      <div class="menu-section">
        <div class="menu-section-title">Settings</div>
        <a class="menu-item" href="#" data-action="preferences">
          <span class="menu-item-icon">⚙️</span>
          <span class="menu-item-text">Preferences</span>
        </a>
        <a class="menu-item" href="https://devtools.khulnasoft.com" target="_blank">
          <span class="menu-item-icon">🌐</span>
          <span class="menu-item-text">Open Dev Tools</span>
        </a>
        <a class="menu-item" href="#" data-action="hide">
          <span class="menu-item-icon">👁️‍🗨️</span>
          <span class="menu-item-text">Hide Toolbar</span>
          <span class="menu-item-shortcut">Esc</span>
        </a>
      </div>
    </div>
  </div>
  
  <script src="toolbar.js"></script>
</body>
</html>
