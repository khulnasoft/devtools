<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTools toolbar</title>
  <style>
    :root { color-scheme: light dark; --panel: #1d1d1f; --panel-hover: #2b2b2e; --panel-active: #343438; --text: #f5f5f5; --muted: #a1a1aa; --border: rgba(255,255,255,.16); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: transparent; color: var(--text); pointer-events: none; }
    button, input { font: inherit; }
    .it-toolbar { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 2px; min-height: 42px; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: 0 8px 30px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.16); z-index: 2; pointer-events: auto; }
    .it-toolbar::before { content: ""; width: 18px; height: 18px; margin: 0 5px 0 4px; background: currentColor; clip-path: polygon(50% 0, 100% 100%, 0 100%); color: var(--text); }
    .toolbar-btn { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; transition: background .14s, color .14s, transform .14s; }
    .toolbar-btn:hover, .toolbar-btn.active { background: var(--panel-hover); color: var(--text); }
    .toolbar-btn:active { transform: scale(.94); }
    .toolbar-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .status-indicator { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #46e47b; box-shadow: 0 0 0 2px var(--panel); }
    .status-indicator.sleeping { background: #71717a; }
    .tooltip { position: absolute; right: 0; bottom: calc(100% + 8px); transform: translateY(4px); opacity: 0; pointer-events: none; white-space: nowrap; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font-size: 11px; box-shadow: 0 6px 16px rgba(0,0,0,.25); transition: opacity .15s, transform .15s; }
    .toolbar-btn:hover .tooltip { opacity: 1; transform: translateY(0); }
    .menu-panel { position: absolute; right: 0; bottom: calc(100% + 9px); width: 318px; max-height: min(560px, calc(100vh - 32px)); overflow: hidden auto; padding: 7px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: 0 18px 50px rgba(0,0,0,.36); opacity: 0; visibility: hidden; transform: translateY(7px); transition: opacity .16s, transform .16s, visibility .16s; pointer-events: none; }
    .menu-panel.open { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
    .search-wrap { position: sticky; top: 0; padding-bottom: 7px; background: var(--panel); }
    .menu-search { width: 100%; padding: 8px 10px 8px 30px; border: 1px solid var(--border); border-radius: 7px; outline: 0; background: var(--panel-hover); color: var(--text); font-size: 12px; }
    .menu-search:focus { border-color: rgba(255,255,255,.45); }
    .search-icon { position: absolute; top: 9px; left: 10px; color: var(--muted); }
    .search-icon svg { width: 14px; height: 14px; }
    .menu-section-title { padding: 9px 8px 5px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .menu-item:hover { background: var(--panel-hover); }
    .menu-item-icon { display: grid; place-items: center; width: 23px; height: 23px; border-radius: 5px; background: var(--panel-active); color: #d4d4d8; font-size: 11px; font-weight: 700; }
    .menu-item-text { flex: 1; font-size: 12px; }
    .menu-item-description { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .menu-item-shortcut { color: var(--muted); font-size: 10px; }
    .menu-divider { height: 1px; margin: 5px 4px; background: var(--border); }
    .empty { padding: 24px 8px; color: var(--muted); text-align: center; font-size: 12px; }
    .drag-handle { position: absolute; inset: 0 0 auto; height: 5px; cursor: move; }
  </style>
</head>
<body>
  <aside class="it-toolbar" id="toolbar" aria-label="DevTools toolbar">
    <span class="status-indicator" id="statusIndicator" aria-label="Toolbar active"></span>
    <span class="drag-handle" id="dragHandle" aria-hidden="true"></span>
    <button class="toolbar-btn" id="menuBtn" type="button" aria-label="Open DevTools menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="tooltip">Tools</span>
    </button>
    <button class="toolbar-btn" id="searchBtn" type="button" aria-label="Search DevTools">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="tooltip">Search</span>
    </button>
    <button class="toolbar-btn" id="inspectBtn" type="button" aria-label="Inspect element">
      <svg viewBox="0 0 24 24"><path d="m5 3 5.8 14.5 2.4-5.1 5.2-2.4L5 3Z"/><path d="m13.2 13.2 4.4 4.4"/></svg><span class="tooltip">Inspect</span>
    </button>
    <button class="toolbar-btn" id="screenshotBtn" type="button" aria-label="Take screenshot">
      <svg viewBox="0 0 24 24"><path d="M4 7h3l1.4-2h3.2L13 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="10" cy="13" r="3"/></svg><span class="tooltip">Screenshot</span>
    </button>
    <button class="toolbar-btn" id="hideBtn" type="button" aria-label="Hide toolbar">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg><span class="tooltip">Hide</span>
    </button>
    <section class="menu-panel" id="menuPanel" aria-label="DevTools menu">
      <div class="search-wrap"><span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span><input class="menu-search" id="menuSearch" type="search" placeholder="Search all tools…" autocomplete="off" aria-label="Search all tools"></div>
      <div id="toolSections"></div>
    </section>
  </aside>
  <script src="toolbar.js"></script>
</body>
</html>
